name: Build and Push Docker Image to GCP

on:
  push:
    branches:
      - main # Or whichever branch you want to trigger the build

env:
  PROJECT_ID: your-gcp-project-id # Replace with your GCP project ID
  REGION: us-central1 # Replace with your GCP region
  GAR_LOCATION: us-central1 # Replace with your Artifact Registry region
  REPOSITORY: your-repository-name # Replace with your Artifact Registry repository name
  IMAGE: your-image-name # Replace with your desired image name
  SERVICE_NAME: your-cloud-run-service-name # Replace with your desired Cloud Run service name
  WORKLOAD_IDENTITY_PROVIDER: projects/1234567890/locations/global/workloadIdentityPools/my-pool/providers/my-provider # Replace with your WIF provider
  SERVICE_ACCOUNT: my-service-account@your-gcp-project-id.iam.gserviceaccount.com # Replace with your service account email

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          # Use the exact digest for immutable deployment
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}@${{ steps.build-push.outputs.digest }}
          flags: '--allow-unauthenticated'

      - name: Show Output URL
        run: echo "Successfully deployed! Access the application at ${{ steps.deploy.outputs.url }}"
